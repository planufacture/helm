---
name: Lint and Test Charts

# yamllint disable-line rule:truthy
on: pull_request

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      # Python is required because `ct lint` runs Yamale (https://github.com/23andMe/Yamale) and
      # yamllint (https://github.com/adrienverge/yamllint) which require Python
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: 3.x
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0

      - name: Add Bitnami Helm repo
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config ct.yaml)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Run chart-testing (lint)
        run: ct lint --config ct.yaml --check-version-increment=false

      # ct lint can't catch a per-service value that silently renders nothing
      # (the diomac CronJob once read env/volumes from the root context), so
      # render it with each per-service key set and check they all come out.
      - name: Check diomac CronJob honours per-service values
        run: |
          out=$(helm template ci charts/planufacture \
            --set application.environment=ci --set configuration=ci --set diomac.key=ci \
            --set-json 'microServices.diomacConnector.env=[{"name":"CI_ENV_CHECK","value":"1"}]' \
            --set-json 'microServices.diomacConnector.volumeMounts=[{"name":"ci-check","mountPath":"/ci-check"}]' \
            --set-json 'microServices.diomacConnector.volumes=[{"name":"ci-check","emptyDir":{}}]' \
            --set-json 'microServices.diomacConnector.resources={"limits":{"memory":"123Mi"}}' \
            --show-only templates/cronjob-diomac-connector.yaml)
          status=0
          for want in "name: CI_ENV_CHECK" "mountPath: /ci-check" "emptyDir: {}" "memory: 123Mi"; do
            grep -qF "$want" <<<"$out" || { echo "::error::diomac CronJob is missing '$want'"; status=1; }
          done
          exit $status

