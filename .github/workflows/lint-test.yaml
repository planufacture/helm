---
name: Lint and Test Charts

# yamllint disable-line rule:truthy
on: pull_request

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      # Python is required because `ct lint` runs Yamale (https://github.com/23andMe/Yamale) and
      # yamllint (https://github.com/adrienverge/yamllint) which require Python
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: 3.x
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0

      - name: Add Bitnami Helm repo
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config ct.yaml)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Run chart-testing (lint)
        run: ct lint --config ct.yaml --check-version-increment=false

      # ct lint can't catch a per-service value that silently renders nothing
      # (the diomac CronJob once read env/volumes from the root context), so
      # render it with each per-service key set and check they all come out.
      - name: Check diomac CronJob honours per-service values
        run: |
          out=$(helm template ci charts/planufacture \
            --set application.environment=ci --set configuration=ci --set diomac.key=ci \
            --set-json 'microServices.diomacConnector.env=[{"name":"CI_ENV_CHECK","value":"1"}]' \
            --set-json 'microServices.diomacConnector.volumeMounts=[{"name":"ci-check","mountPath":"/ci-check"}]' \
            --set-json 'microServices.diomacConnector.volumes=[{"name":"ci-check","emptyDir":{}}]' \
            --set-json 'microServices.diomacConnector.resources={"requests":{"memory":"123Mi"},"limits":{"memory":"123Mi"}}' \
            --show-only templates/cronjob-diomac-connector.yaml)
          status=0
          for want in "name: CI_ENV_CHECK" "mountPath: /ci-check" "emptyDir: {}" "memory: 123Mi"; do
            grep -qF "$want" <<<"$out" || { echo "::error::diomac CronJob is missing '$want'"; status=1; }
          done
          exit $status

      # ServiceMonitors only render when the cluster has the Prometheus
      # Operator CRD, which CI has no cluster to report, so ct lint never sees
      # them. Render with the CRD declared and check each one carries oauth2,
      # and that a service's own metrics.enabled: false switches its monitor off.
      - name: Check ServiceMonitors render with OAuth2
        run: |
          render() {
            helm template ci charts/planufacture \
              --set application.environment=ci --set configuration=ci --set diomac.key=ci \
              --set microServices.mcp.enabled=true \
              --api-versions monitoring.coreos.com/v1/ServiceMonitor \
              --show-only templates/service-monitor.yaml "$@"
          }
          out=$(render)
          monitors=$(grep -c '^kind: ServiceMonitor' <<<"$out" || true)
          with_oauth=$(grep -c '^      oauth2:' <<<"$out" || true)
          status=0
          [ "$monitors" -gt 0 ] || { echo "::error::no ServiceMonitors rendered"; status=1; }
          [ "$monitors" = "$with_oauth" ] || { echo "::error::$monitors ServiceMonitors but $with_oauth oauth2 blocks"; status=1; }
          grep -qF 'key: metrics-client-secret' <<<"$out" || { echo "::error::oauth2 clientSecret key missing"; status=1; }
          # domain rejects tokens without an organization claim
          with_scope=$(grep -c '^          - organization$' <<<"$out" || true)
          [ "$monitors" = "$with_scope" ] || { echo "::error::$monitors ServiceMonitors but $with_scope request the organization scope"; status=1; }
          off=$(render --set microServices.solver.metrics.enabled=false)
          grep -q 'name: ci-planufacture-solver$' <<<"$off" && { echo "::error::solver ServiceMonitor rendered with metrics.enabled=false"; status=1; }
          exit $status

      # Every Deployment must spread against its own pods only: a selector
      # that matched the whole release would spread every service against
      # every other one. Also check the per-service override and the switch.
      - name: Check Deployments spread across nodes and zones
        run: |
          render() {
            helm template ci charts/planufacture \
              --set application.environment=ci --set configuration=ci --set diomac.key=ci \
              --set microServices.mcp.enabled=true \
              --show-only templates/deployment.yaml "$@"
          }
          status=0
          bad=$(render | yq 'select(.kind=="Deployment")
            | select(
                (.spec.template.spec.topologySpreadConstraints | length) != 2
                or ([.spec.template.spec.topologySpreadConstraints[] as $c
                     | select(($c.labelSelector.matchLabels | to_json(0)) != (.spec.selector.matchLabels | sort_keys(.) | to_json(0))
                              or ($c.matchLabelKeys | to_json(0)) != "[\"pod-template-hash\"]")] | length) > 0)
            | .metadata.name')
          [ -z "$bad" ] || { echo "::error::Deployments missing correct topology spread: $bad"; status=1; }
          over=$(render --set-json 'microServices.gateway.topologySpreadConstraints=[]' \
            | yq 'select(.metadata.name=="ci-planufacture-gateway") | .spec.template.spec.topologySpreadConstraints | length')
          [ "$over" = "0" ] || { echo "::error::gateway override [] still rendered $over constraints"; status=1; }
          off=$(render --set topologySpread.enabled=false | grep -c topologySpreadConstraints || true)
          [ "$off" = "0" ] || { echo "::error::topologySpread.enabled=false still rendered $off"; status=1; }
          exit $status

#      - name: Create kind cluster
#        uses: helm/kind-action@0025e74a8c7512023d06dc019c617aa3cf561fde # v1.10.0
