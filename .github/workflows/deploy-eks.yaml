name: Deploy to EKS
run-name: Deploy to EKS - ${{ github.event.inputs.environment || 'dev' }}

on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        type: environment
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment: ${{ github.event.inputs.environment || 'dev' }}
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Show deployment target
        run: |
          echo "::notice title=Deploy target::${ENVIRONMENT} (namespace ${NAMESPACE}, release ${NAME}, cluster ${CLUSTER_NAME})"
          echo "Environment : ${ENVIRONMENT}"
          echo "Cluster     : ${CLUSTER_NAME}"
          echo "Namespace   : ${NAMESPACE}"
          echo "Release     : ${NAME}"
          echo "Triggered by: ${{ github.event_name }}"
        env:
          NAMESPACE: ${{ vars.NAMESPACE }}
          NAME: ${{ vars.NAME }}
          CLUSTER_NAME: ${{ vars.CLUSTER_NAME }}

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: HelmDeploy-${{ github.run_id }}

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.13.0

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ vars.AWS_REGION }} --name ${{ vars.CLUSTER_NAME }}

      - name: Add Helm repositories
        run: |
          helm repo add planufacture https://charts.planufacture.tech
          helm repo update

      - name: Create values file from secret
        run: |
          echo "${{ secrets.HELM_VALUES }}" > values.yaml

      - name: Fetch or generate Redis password
        run: |
          REDIS_PASSWORD=$(kubectl get secret --namespace "${NAMESPACE}" "${NAME}-redis" -o jsonpath="{.data.redis-password}" 2>/dev/null | base64 -d) || true
          if [ -z "${REDIS_PASSWORD}" ]; then
            REDIS_PASSWORD=$(openssl rand -base64 24)
          fi
          echo "REDIS_PASSWORD=${REDIS_PASSWORD}" >> $GITHUB_ENV
        env:
          NAMESPACE: ${{ vars.NAMESPACE }}
          NAME: ${{ vars.NAME }}

      - name: Deploy to Kubernetes
        run: |
          echo "Deploying planufacture/planufacture as ${NAME} to ${ENVIRONMENT} (namespace ${NAMESPACE})"
          helm upgrade --install ${NAME} planufacture/planufacture \
            --namespace "${NAMESPACE}" \
            -f values.yaml \
            --set redis.auth.password="${REDIS_PASSWORD}" \
            --wait \
            --timeout 10m
        env:
          NAMESPACE: ${{ vars.NAMESPACE }}
          NAME: ${{ vars.NAME }}

      - name: Deployment summary
        if: always()
        run: |
          # --all keeps the states that matter on the failure path: a run
          # cancelled mid-upgrade leaves the release pending-upgrade, which
          # helm's default filter hides. Errors go to the log rather than
          # /dev/null so an empty table is never silently reported as a deploy.
          RELEASE_JSON=$(helm list --all --namespace "${NAMESPACE}" --filter "^${NAME}$" -o json || echo '[]')
          if ! printf '%s' "${RELEASE_JSON}" | jq -e . >/dev/null 2>&1; then
            echo "helm list did not return usable JSON"
            RELEASE_JSON='[]'
          fi
          CHART=$(printf '%s' "${RELEASE_JSON}" | jq -r '.[0].chart // "unknown"')
          APP_VERSION=$(printf '%s' "${RELEASE_JSON}" | jq -r '.[0].app_version // "unknown"')
          REVISION=$(printf '%s' "${RELEASE_JSON}" | jq -r '.[0].revision // "unknown"')
          STATUS=$(printf '%s' "${RELEASE_JSON}" | jq -r '.[0].status // "unknown"')
          {
            if [ "${JOB_STATUS}" = "success" ]; then
              echo "## Deployed to \`${ENVIRONMENT}\`"
              echo ""
            else
              echo "## Deploy to \`${ENVIRONMENT}\` ${JOB_STATUS}"
              echo ""
              echo "The release details below are whatever is currently in the cluster,"
              echo "which may predate this run."
              echo ""
            fi
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Environment | \`${ENVIRONMENT}\` |"
            echo "| Cluster | \`${CLUSTER_NAME}\` |"
            echo "| Namespace | \`${NAMESPACE}\` |"
            echo "| Release | \`${NAME}\` |"
            echo "| Chart | \`${CHART}\` |"
            echo "| App version | \`${APP_VERSION}\` |"
            echo "| Helm revision | \`${REVISION}\` |"
            echo "| Release status | \`${STATUS}\` |"
            echo "| Job result | \`${JOB_STATUS}\` |"
            echo "| Triggered by | \`${{ github.event_name }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          NAMESPACE: ${{ vars.NAMESPACE }}
          NAME: ${{ vars.NAME }}
          CLUSTER_NAME: ${{ vars.CLUSTER_NAME }}
          JOB_STATUS: ${{ job.status }}
