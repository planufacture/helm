---
name: Update Helm Chart Version
run-name: Update ${{ github.event.client_payload.service }} to ${{ github.event.client_payload.version }}

on:
  repository_dispatch:
    types: [update-helm-version]

jobs:
  update-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod a+x /usr/local/bin/yq

      - name: Update Chart Version
        env:
          NEW_VERSION: ${{ github.event.client_payload.version }}
          SERVICE_NAME: ${{ github.event.client_payload.service }}
        run: |
          # Remove leading 'v' if present
          CLEAN_VERSION="${NEW_VERSION#v}"

          # Update the specific microservice version in values.yaml
          yq -i ".microServices.$SERVICE_NAME.image.tag = \"$CLEAN_VERSION\"" charts/planufacture/values.yaml

          # Track UI version as appVersion in Chart.yaml
          if [ "$SERVICE_NAME" = "ui" ]; then
            sed -i "s/appVersion: .*/appVersion: \"$CLEAN_VERSION\"/" charts/planufacture/Chart.yaml
          fi

      - name: Build pull request body
        id: body
        env:
          NEW_VERSION: ${{ github.event.client_payload.version }}
          SERVICE_NAME: ${{ github.event.client_payload.service }}
          RELEASE_URL: ${{ github.event.client_payload.release_url }}
        run: |
          BODY_FILE="$RUNNER_TEMP/pr-body.md"

          # The branch is reused until the PR merges and this body is rewritten
          # on every release, so it only describes the current state. The notes
          # for each version go in comments, which nothing here overwrites.
          {
            echo "Updates the \`$SERVICE_NAME\` microservice image tag to \`${NEW_VERSION#v}\`."
            echo
            if [ -n "$RELEASE_URL" ]; then
              echo "Latest release: [$NEW_VERSION]($RELEASE_URL)"
            else
              echo "Latest release: $NEW_VERSION"
            fi
            echo
            echo "Release notes for every version this PR covers are in the comments below."
            echo
            echo "---"
            echo "_Automatically created by the Update Helm Chart Version workflow._"
          } > "$BODY_FILE"

          echo "path=$BODY_FILE" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: update ${{ github.event.client_payload.service }} version to ${{ github.event.client_payload.version }}"
          title: "chore: update ${{ github.event.client_payload.service }} version to ${{ github.event.client_payload.version }}"
          body-path: ${{ steps.body.outputs.path }}
          branch: update-${{ github.event.client_payload.service }}-version
          base: main

      - name: Comment release notes on the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          NEW_VERSION: ${{ github.event.client_payload.version }}
          SOURCE_REPO: ${{ github.event.client_payload.repository }}
          RELEASE_URL: ${{ github.event.client_payload.release_url }}
          RELEASE_NOTES: ${{ github.event.client_payload.release_notes }}
          BRANCH: update-${{ github.event.client_payload.service }}-version
        run: |
          PR="$PR_NUMBER"
          if [ -z "$PR" ]; then
            # No diff to push means no new PR, but an open one may still exist
            PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" \
              --state open --json number --jq '.[0].number // ""')
          fi
          if [ -z "$PR" ]; then
            echo "No open pull request to comment on"
            exit 0
          fi

          if [ -z "$RELEASE_NOTES" ]; then
            echo "No release notes in the dispatch payload from ${SOURCE_REPO:-the releasing repository}"
            exit 0
          fi

          # A re-dispatched tag must not comment twice
          MARKER="<!-- release-notes:${NEW_VERSION} -->"
          if gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json comments \
               --jq '.comments[].body' | grep -qF "$MARKER"; then
            echo "Release notes for $NEW_VERSION are already on PR #$PR"
            exit 0
          fi

          COMMENT="$RUNNER_TEMP/comment.md"
          {
            echo "$MARKER"
            if [ -n "$RELEASE_URL" ]; then
              echo "## [$NEW_VERSION]($RELEASE_URL)"
            else
              echo "## $NEW_VERSION"
            fi
            echo
            # Demote headings in the notes so the version heading stays top
            # level, leaving anything inside a fenced code block untouched.
            printf '%s\n' "$RELEASE_NOTES" | awk '
              /^[[:space:]]*```/ { fence = !fence; print; next }
              !fence {
                n = 0
                while (substr($0, n + 1, 1) == "#") n++
                if (n >= 1 && n <= 5 && substr($0, n + 1, 1) == " ") $0 = "#" $0
              }
              { print }'
          } > "$COMMENT"

          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$COMMENT"

