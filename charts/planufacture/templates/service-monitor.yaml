{{- if and .Values.metrics.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/ServiceMonitor") }}
{{- $sm := .Values.metrics.serviceMonitor }}
{{- range $key, $val := .Values.microServices }}
{{- $context := merge (dict "key" $key) $ }}
{{- if and .service .metrics (include "planufacture.componentEnabled" .) }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "planufacture.fullname" $context }}
  labels:
    {{- include "planufacture.labels" $context | nindent 4 }}
    {{- with $sm.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "planufacture.selectorLabels" $context | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .metrics.path | default $sm.path }}
      interval: {{ .metrics.interval | default $sm.interval }}
      {{- with $sm.oauth2 }}
      {{- if .enabled }}
      oauth2:
        tokenUrl: {{ required "metrics.serviceMonitor.oauth2.tokenUrl is required when oauth2 is enabled" .tokenUrl | quote }}
        clientId:
          secret:
            name: {{ required "keycloak.existingSecret is required for ServiceMonitor oauth2" $.Values.keycloak.existingSecret }}
            key: {{ .clientIdKey }}
        clientSecret:
          name: {{ $.Values.keycloak.existingSecret }}
          key: {{ .clientSecretKey }}
      {{- end }}
      {{- end }}
---
{{- end }}
{{- end }}
{{- end }}
