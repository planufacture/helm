{{- if include "planufacture.componentEnabled" .Values.microServices.diomacConnector }}
{{- $dc := $.Values.microServices.diomacConnector }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: "{{.Release.Name}}"
  labels:
    {{- include "planufacture.labels" (merge (dict "versionKey" "diomacConnector") $) | nindent 4 }}
spec:
  schedule: {{ $dc.schedule | quote }}
  timeZone: {{ $dc.timeZone | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          {{- with $.Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsUser: 999
            fsGroup: 999
          restartPolicy: Never
          {{- if $.Values.mongo.enabled }}
          initContainers:
            - name: wait-mongo
              image: "{{ $.Values.busybox.image.repository }}:{{ $.Values.busybox.image.tag }}"
              command: ['sh', '-c', 'until nc -z -v -w30 mongo 27017; do echo "Waiting for mongo..."; sleep 2; done;']
          {{- end }}
          containers:
            {{- $image := dict }}
            {{- if kindIs "map" $dc.image }}
            {{- $image = $dc.image }}
            {{- end }}
            - name: diomac-connector
              image: "{{ $.Values.imageRegistry }}/planufacture/diomac-connector:{{ $image.tag | default $.Chart.AppVersion }}"
              imagePullPolicy: {{ $.Values.image.pullPolicy }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                {{- toYaml (default $.Values.resources $dc.resources) | nindent 16 }}
              env:
                - name: SPRING_PROFILES_ACTIVE
                  valueFrom:
                    configMapKeyRef:
                      name: {{ include "planufacture.fullname" $ }}-profile
                      key: active
                - name: SPRING_CLOUD_CONFIG_LABEL
                  value: {{ required "A valid .Values.application.environment is required" $.Values.application.environment }}
                {{- /* Boot 3 reads SPRING_DATA_MONGODB_URI, Boot 4 reads SPRING_MONGODB_URI; drop the old name once diomac is on Boot 4 */}}
                {{- range $envName := list "SPRING_DATA_MONGODB_URI" "SPRING_MONGODB_URI" }}
                - name: {{ $envName }}
                  valueFrom:
                    secretKeyRef:
                      {{- if $dc.mongo.existingSecret }}
                      name: {{ $dc.mongo.existingSecret }}
                      key: {{ $dc.mongo.existingSecretKey | default "mongo-uri" }}
                      {{- else if $.Values.mongo.enabled }}
                      name: {{ include "planufacture.fullname" $ }}-diomac-connector
                      key: mongo-uri
                      {{- else }}
                      {{ required "microServices.diomacConnector.mongo.existingSecret is required when mongo.enabled is false" $dc.mongo.existingSecret }}
                      {{- end }}
                {{- end }}
                - name: DIOMAC_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "planufacture.fullname" $ }}-diomac
                      key: key

                # OAuth client for diomac-connector — provisioned per tenant
                # by terraform's keycloak-tenants module into the
                # keycloak-credentials Secret. (DIOMAC_API_KEY above stays in
                # the chart-managed -diomac Secret because it's the Diomac
                # platform's external API key, not a Keycloak credential.)
                - name: DIOMAC_OAUTH2_CLIENT
                  valueFrom:
                    secretKeyRef:
                      name: {{ $.Values.keycloak.existingSecret }}
                      key: diomac-client-id
                - name: DIOMAC_OAUTH2_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: {{ $.Values.keycloak.existingSecret }}
                      key: diomac-client-secret
                {{- if $.Values.rabbit.existingSecret }}
                - name: SPRING_RABBITMQ_HOST
                  valueFrom:
                    secretKeyRef:
                      name: {{ $.Values.rabbit.existingSecret }}
                      key: host
                - name: SPRING_RABBITMQ_PORT
                  valueFrom:
                    secretKeyRef:
                      name: {{ $.Values.rabbit.existingSecret }}
                      key: port
                - name: SPRING_RABBITMQ_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: {{ $.Values.rabbit.existingSecret }}
                      key: username
                - name: SPRING_RABBITMQ_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ $.Values.rabbit.existingSecret }}
                      key: password
                - name: SPRING_RABBITMQ_VIRTUAL_HOST
                  valueFrom:
                    secretKeyRef:
                      name: {{ $.Values.rabbit.existingSecret }}
                      key: vhost
                {{- else }}
                - name: SPRING_RABBITMQ_HOST
                  value: "rabbitmq-cluster.infrastructure.svc"
                - name: SPRING_RABBITMQ_PORT
                  value: "5672"
                - name: SPRING_RABBITMQ_USERNAME
                  value: {{ $.Release.Namespace }}
                - name: SPRING_RABBITMQ_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "planufacture.fullname" $ }}-rabbit
                      key: password
                - name: SPRING_RABBITMQ_VIRTUAL_HOST
                  value: {{ $.Release.Namespace }}
                {{- end }}
                {{- with $dc.env }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              {{- with $dc.volumeMounts }}
              volumeMounts:
              {{- toYaml . | nindent 14 }}
              {{- end }}
              {{- with $dc.volumes }}
          volumes:
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- with $.Values.nodeSelector }}
          nodeSelector:
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- with $.Values.affinity }}
          affinity:
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- with $.Values.tolerations }}
          tolerations:
          {{- toYaml . | nindent 10 }}
          {{- end }}
{{- end }}
