{{- $chat := .Values.microServices.chat }}
{{- $anthropic := include "planufacture.chatAnthropic" $ | fromYaml }}
{{- if and (kindIs "map" $chat) (include "planufacture.componentEnabled" $chat) (not $anthropic.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "planufacture.fullname" $ }}-chat-anthropic
  labels:
    {{- include "planufacture.labels" . | nindent 4 }}
data:
  anthropic-api-key: {{ required "chat.anthropic.existingSecret, or chat.anthropic.apiKey (via HELM_VALUES), is required when microServices.chat is enabled" $anthropic.apiKey | b64enc | quote }}
{{- end }}
