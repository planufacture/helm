# Default values for planufacture.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
---
application: {}
# Registry (host, optionally + pull-through-cache prefix) for the planufacture
# service images. Defaults to ghcr.io. On EKS, override to the ECR mirror so
# pods pull via node IAM and no imagePullSecret is needed, e.g.
#   imageRegistry: 503561419401.dkr.ecr.eu-west-1.amazonaws.com/ghcr
imageRegistry: ghcr.io
# Default resources per component. Memory request == limit (a pod is never
# scheduled onto memory it may later need); CPU is a request only, except for
# the domain and Axon Server, which also have a CPU limit.
# Sized from the 7-day peak working set across all environments plus headroom.
#
# Helm deep-merges an environment's `resources` block onto these defaults, so
# an override that sets only some keys keeps the rest. Raising memory means
# setting requests.memory and limits.memory together: raising only the request
# leaves the default limit below it, and the chart fails to render.
#
# Don't null limits.memory on a JVM service. With no limit the JVM sizes its
# heap from the node's 16 GiB, and MaxRAMPercentage below would hand it 50-75%
# of the node.
#
# javaToolOptions: the images set no heap flags, so the JVM sizes its heap at
# 25% of the container memory limit (it was 25% of the node's 16 GiB while no
# limit was set). MaxRAMPercentage raises that share, leaving the rest for
# metaspace, code cache, thread stacks and direct buffers. It is a percentage,
# so it follows an environment's resources override. Rendered as the
# JAVA_TOOL_OPTIONS env var unless the component's `env` already sets it;
# set to "" to omit.
microServices:
  ui:
    image:
      repository: planufacture/ui
      tag: 0.1.243
    # Node 22 (Next.js standalone); peak ~64Mi. V8 sizes its heap from the
    # cgroup limit.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 128Mi
    service:
      port: 3000
    startupProbe:
      httpGet:
        path: /
        port: http
      failureThreshold: 10
      periodSeconds: 5
    livenessProbe:
      httpGet:
        path: /
        port: http
    readinessProbe:
      httpGet:
        path: /
        port: http
  # Stock-movement UI for customers without Diomac (planufacture/ui-connector).
  # The gateway routes /connector and /connector/** to it. Off until an
  # environment needs it: enable it per environment, together with the gateway
  # route in that environment's config.
  uiConnector:
    enabled: false
    image:
      # The chart would otherwise default to planufacture/planufacture-ui-connector.
      repository: planufacture/ui-connector
      # Set by update-helm-chart.yaml on each ui-connector release. Without a
      # tag, the image falls back to the chart's appVersion, which is the ui's
      # version, and no ui-connector image has that tag.
      tag: 0.1.1
    # Node 26 (Next.js standalone). Unmeasured: ui peaks at ~64Mi, so this
    # starts at twice ui's size. Lower it once there are metrics.
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 256Mi
    service:
      port: 3000
    # Served under basePath /connector, so `/` is a 404. The health route
    # answers at request time with no login.
    startupProbe:
      httpGet:
        path: /connector/api/health
        port: http
      failureThreshold: 10
      periodSeconds: 5
    livenessProbe:
      httpGet:
        path: /connector/api/health
        port: http
    readinessProbe:
      httpGet:
        path: /connector/api/health
        port: http
  configServer:
    image:
      tag: 0.0.15
    service:
      port: 8888
    configuration: true
    metrics:
      enabled: true
    # Peak ~489Mi. Heap 320Mi, ~320Mi non-heap.
    resources:
      requests:
        cpu: 50m
        memory: 640Mi
      limits:
        memory: 640Mi
    javaToolOptions: "-XX:MaxRAMPercentage=50.0"
  domain:
    replicaCount: 1
    mongo:
      db: domain
      existingSecret: mongodb-credentials
      existingSecretKey: domain-connection-string
    rabbit: true
    image:
      tag: 0.4.1
    service:
      port: 9500
    metrics:
      enabled: true
    # The only microservice with a CPU limit: it caps one tenant's bursts on a
    # shared node. Java counts processors from the limit, so it also sets how
    # many GC and worker threads the JVM runs. 2 lets GC and request threads
    # run side by side; at 1, heavy queries and GC queue behind each other
    # and the liveness probe times out.
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: '2'
        memory: 1Gi
    # The JVM picks G1 itself only with at least 2 processors and 1792Mi, so
    # with the default 1Gi it would get the Serial collector, whose
    # stop-the-world pauses also stall the liveness endpoint. UseG1GC sets the
    # collector explicitly. Off-heap use is ~300Mi, so keep MaxRAMPercentage
    # at 50 or below.
    javaToolOptions: "-XX:+UseG1GC -XX:MaxRAMPercentage=50.0"
  gateway:
    replicaCount: 2
    redis: true
    image:
      tag: 0.0.29
    service:
      port: 9501
    metrics:
      enabled: true
    # Peak ~419Mi per replica. Heap 320Mi, ~320Mi non-heap (Netty direct
    # buffers, Redis).
    resources:
      requests:
        cpu: 100m
        memory: 640Mi
      limits:
        memory: 640Mi
    javaToolOptions: "-XX:MaxRAMPercentage=50.0"
  mcp:
    enabled: false
    image:
      tag: 0.0.44
    service:
      port: 9510
    metrics:
      enabled: true
    # Peak ~409Mi. Heap 320Mi, ~320Mi non-heap.
    resources:
      requests:
        cpu: 100m
        memory: 640Mi
      limits:
        memory: 640Mi
    javaToolOptions: "-XX:MaxRAMPercentage=50.0"
  # AI assistant (planufacture-chat). The gateway routes /chat/** to it; it
  # calls mcp's tools with the user's own token, so it requires mcp enabled.
  # Before enabling: the Anthropic key Secret (see `chat.anthropic` below) and the
  # `chat-connection-string` key in mongodb-credentials (terraform's
  # mongodb-incluster module, once `chat` is in mongodb_services) must exist,
  # or the pod fails on a missing secret key.
  chat:
    enabled: false
    # image.tag is set by update-helm-chart.yaml on each planufacture-chat
    # release; the render fails if chat is enabled before there is one.
    image:
      tag: 0.0.4
    service:
      port: 9540
    metrics:
      enabled: true
    redis: true
    mongo:
      db: chat
      existingSecret: mongodb-credentials
      existingSecretKey: chat-connection-string
    # Unmeasured; sized like mcp until there are metrics.
    resources:
      requests:
        cpu: 100m
        memory: 640Mi
      limits:
        memory: 640Mi
    javaToolOptions: "-XX:MaxRAMPercentage=50.0"
  diomacConnector:
    # Diomac is a per-customer integration. Set `enabled: false` for tenants
    # that don't use it — the CronJob, the -diomac Secret (and so the
    # `diomac.key` requirement) and domain's ADMIN_DIOMAC_API_KEY are all
    # omitted.
    #
    # This flag covers the chart only. Also leave `admin.diomac.base-url` unset
    # in the tenant's config-server profile: domain builds its Diomac client off
    # that property, so a profile that inherits one (the development profile
    # does) would have domain calling Diomac with no api-key behind it.
    enabled: true
    schedule: "*/5 5-20 * * *"
    timeZone: "Europe/Dublin"
    # A "*/N" minute field is rewritten to "<offset>-59/N" so tenants don't all
    # hit mongo in the same minute. The offset is a hash of the namespace;
    # set scheduleOffset (0..N-1) to pin it, or staggerSchedule: false to keep
    # the schedule verbatim.
    staggerSchedule: true
    scheduleOffset: null
    # Max random delay (seconds) before the connector starts, to spread tenants
    # sharing a minute slot. 0 disables. Keep well under the schedule interval.
    startJitterSeconds: 0
    image:
      tag: 0.0.189
    mongo:
      db: diomac-connector
      existingSecret: mongodb-credentials
      existingSecretKey: diomac-connection-string
    # Peak ~735Mi working set (~780Mi RSS) while its heap was uncapped.
    # Heap 768Mi, 256Mi non-heap.
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        memory: 1Gi
    javaToolOptions: "-XX:MaxRAMPercentage=75.0"
  solver:
    image:
      repository: planufacture/solver
      tag: 1.3.42
    metrics:
      enabled: true
    mongo:
      db: solver
      existingSecret: mongodb-credentials
      existingSecretKey: solver-connection-string
    service:
      port: 9520
    # A solve keeps at most ~200Mi live on the heap, but it allocates fast.
    # Below 1792Mi the JVM picks the Serial collector, whose small young
    # generation promotes short-lived objects until the old generation fills;
    # the container then reaches its limit before the first full GC. UseG1GC
    # sets the collector explicitly: G1 sizes the young generation to the
    # allocation rate and cleans the old generation concurrently, well before
    # the heap is full. Off-heap use is ~150Mi metaspace and code cache plus
    # ~150-250Mi native, so keep MaxRAMPercentage at 50 or below.
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        memory: 1Gi
    javaToolOptions: "-XX:+UseG1GC -XX:MaxRAMPercentage=50.0"
busybox:
  image:
    repository: 503561419401.dkr.ecr.eu-west-1.amazonaws.com/docker-hub/library/busybox
    tag: "1.31"
axonserver:
  enabled: false
  image:
    repository: 503561419401.dkr.ecr.eu-west-1.amazonaws.com/docker-hub/axoniq/axonserver
    tag: 2025.2.1-nonroot
  storage:
    events: 5Gi
    logs: 1Gi
    data: 1Gi
    # StorageClass per volume (events / logs / data). Only a NEW StatefulSet
    # uses these: volumeClaimTemplates are immutable, so when the release's
    # Axon StatefulSet already exists the template looks it up and keeps
    # each volume's current class (none, on every release created before
    # this). An empty value renders no storageClassName (cluster default).
    # gp3-xfs-backup is xfs (no 5% root reservation; Axon runs non-root),
    # reclaim Retain, tagged backup=enabled for AWS Backup.
    className:
      events: gp3-xfs-backup
      logs: ""
      data: gp3-xfs-backup
  properties: ""
  resources:
    limits:
      cpu: '1'
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 1Gi
# Shared in-cluster Redis (Bitnami chart deployed by terraform/modules/redis-incluster
# into the `infrastructure` namespace). All connection details — host, port,
# username, password — come from a kubernetes Secret (default name
# "redis-credentials") provisioned by the same module into each tenant
# namespace. Apps must namespace keys with "<release-namespace>:" — the ACL
# user only permits keys matching that prefix.
redis:
  tls: false
  existingSecret: redis-credentials
# Per-tenant Keycloak credentials (provisioned by
# terraform/modules/keycloak-tenants into a kubernetes Secret in each tenant
# namespace). Solver and diomac-connector read their OAuth client id/secret
# from this Secret.
keycloak:
  existingSecret: keycloak-credentials
# Per-env credentials for the shared in-cluster RabbitMQ broker
# (`rabbit.infrastructure.svc`), provisioned by terraform into a Secret in
# each tenant namespace. Holds host, port, vhost, username, password, and a
# full connection-string. When `existingSecret` is set, all SPRING_RABBITMQ_*
# env vars are sourced from it; the old broker (rabbitmq-cluster) is used
# when an env overrides this to an empty string and provides `rabbit.password`.
rabbit:
  existingSecret: rabbitmq-credentials
replicaCount: 1
image:
  repository: nginx
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
# Only needed when pulling the planufacture images from ghcr.io (the default).
# On EKS with imageRegistry pointed at the ECR mirror, pods pull via node IAM —
# set this to [] and the ghcr pull secret is no longer required.
imagePullSecrets:
  - name: planufacture-credentials
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
podAnnotations: {}
podLabels: {}
podSecurityContext:
  fsGroup: 65532
securityContext:
  capabilities:
    drop:
      - ALL
  # readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
service:
  name: gateway
  type: ClusterIP
  port: 9501
ingress:
  enabled: false
  className: ""
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
resources: {}
# We usually recommend not to specify default resources and to leave this as a conscious
# choice for the user. This also increases chances charts run on environments with little
# resources, such as Minikube. If you do want to specify resources, uncomment the following
# lines, adjust them as necessary, and remove the curly braces after 'resources:'.
# limits:
#   cpu: 100m
#   memory: 128Mi
# requests:
#   cpu: 100m
#   memory: 128Mi

startupProbe:
  httpGet:
    path: /actuator/health
    port: http
  failureThreshold: 30
  periodSeconds: 10
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# Diomac platform API key, consumed by the diomac-connector CronJob and the
# domain service. `diomac.key` is required only while
# microServices.diomacConnector.enabled is true.
diomac: {}
# Anthropic API key for microServices.chat, used only while chat is enabled.
# Always from a pre-provisioned per-tenant Secret in the release namespace.
# The chart never creates it and refuses a plain apiKey value.
chat:
  anthropic:
    existingSecret: anthropic-credentials
    existingSecretKey: anthropic-api-key
metrics:
  # Creates a ServiceMonitor for each service with `metrics.enabled: true`.
  # Skipped when the cluster has no ServiceMonitor CRD (Prometheus Operator).
  enabled: true
  serviceMonitor:
    path: /actuator/prometheus
    interval: 30s
    # Extra labels to add to ServiceMonitor resources (e.g. release: kube-prometheus-stack)
    labels: {}
    # /actuator/prometheus sits behind the services' JWT security, so
    # Prometheus fetches a client-credentials token from Keycloak and scrapes
    # with it. The client is the per-environment "metrics" confidential client
    # that terraform's keycloak-tenants module writes into the
    # keycloak.existingSecret Secret. Set enabled: false to scrape without auth.
    oauth2:
      enabled: true
      tokenUrl: https://login.dev.planufacture.tech/realms/planufacture/protocol/openid-connect/token
      clientIdKey: metrics-client-id
      clientSecretKey: metrics-client-secret
      # domain's TenantWebFilter rejects any JWT without an `organization`
      # claim, actuator included. The bare scope returns every Organization
      # the metrics service account is a member of; metrics aren't tenant
      # data, so which one doesn't matter. Keycloak omits the claim unless the
      # service account is a member of at least one Organization.
      scopes:
        - organization
nodeSelector: {}
tolerations: []
affinity: {}
# Spreads each microservice Deployment's replicas across nodes and zones. The
# scheduler's built-in spreading is only a weak score: on a rollout that
# coincides with a new, empty node, every replica can land on that one node,
# and a second replica then protects nothing.
#
# The chart adds to each constraint a labelSelector built from that service's
# own selector labels (so a service spreads only against its own pods) and
# matchLabelKeys: [pod-template-hash] (so during a rolling update the surge pod
# is counted only against the new ReplicaSet's pods). A constraint that already
# sets either keeps its own.
#
# Override per service with microServices.<name>.topologySpreadConstraints,
# which replaces these defaults for that service ([] means none). Set
# enabled: false to drop the defaults for every service.
# Not applied to the Axon Server StatefulSet or the diomac CronJob.
topologySpread:
  enabled: true
  constraints:
    # Hard rule: a node may hold at most one more of a service's replicas than
    # any other eligible node, so 2 replicas never share a node while there
    # are 2+ nodes. With more replicas than nodes, some nodes hold two.
    - topologyKey: kubernetes.io/hostname
      maxSkew: 1
      whenUnsatisfiable: DoNotSchedule
      # Leave cordoned or tainted nodes out of the skew count.
      nodeTaintsPolicy: Honor
    # Preference only, so a full zone can't block a rollout.
    - topologyKey: topology.kubernetes.io/zone
      maxSkew: 1
      whenUnsatisfiable: ScheduleAnyway
      nodeTaintsPolicy: Honor
